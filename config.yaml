tournament_name: "YULA Invite 2026"
tagline: "Three divisions. 50 teams. One epic weekend of competition."
description: |
  Welcome to the official home of the YULA Invite! Teams from across the region 
  converge across multiple local venues for intense pool play followed by 
  high-stakes playoff brackets, where the winner gains an automatic bid to High School Nationals. 
  Check your division schedule, track live standings, and 
  coordinate your game times right here.
